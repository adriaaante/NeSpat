<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Запись на мероприятие — НЕ СПАТЬ МОСКВА</title>
  <meta name="description" content="Запишись на тренировку или событие клуба «НЕ СПАТЬ МОСКВА»: имя и телефон — и ты в списке.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0a0a0b">
  <meta property="og:title" content="Запись на мероприятие — НЕ СПАТЬ МОСКВА">
  <meta property="og:description" content="Тренировки, забеги и события клуба. Запишись за 10 секунд.">
  <meta property="og:image" content="https://nespatmoskva.ru/assets/img/team-main.jpg">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preload" href="assets/fonts/oswald-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* шрифты локальные — как на всём сайте */
    @font-face { font-family: "Oswald"; src: url("assets/fonts/oswald-cyrillic.woff2") format("woff2"); font-weight: 400 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/oswald-latin.woff2") format("woff2"); font-weight: 400 700; font-display: swap; unicode-range: U+0000-00FF, U+2000-206F; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/inter-cyrillic.woff2") format("woff2"); font-weight: 400 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin.woff2") format("woff2"); font-weight: 400 700; font-display: swap; unicode-range: U+0000-00FF, U+2000-206F; }
    :root { --bg:#0a0a0b; --card:#16161a; --line:#2a2a2e; --ink:#f5f4f2; --dim:#b6b3ae; --mute:#85827d; --red:#e02b2b; --red2:#ff3b3b; --ok:#3fb86b; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--ink); font: 16px/1.55 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--ink); }
    [hidden] { display: none !important; }
    .page { min-height: 100svh; display: flex; flex-direction: column; background: radial-gradient(ellipse at top, #1d0b0b 0%, var(--bg) 55%); }
    header { display: flex; align-items: center; justify-content: space-between; padding: 18px max(20px, env(safe-area-inset-left)); max-width: 720px; width: 100%; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand img { width: 34px; height: auto; display: block; }
    .brand span { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; }
    header .all { font-size: 13px; color: var(--dim); text-decoration: none; }
    main { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 8px 20px 48px; }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--red); }
    h1 { font-family: "Oswald", sans-serif; font-weight: 600; font-size: clamp(30px, 7vw, 46px); line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; margin: 8px 0 18px; }
    .facts { display: grid; gap: 10px; margin: 0 0 18px; }
    .fact { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; }
    .fact svg { width: 22px; height: 22px; color: var(--red); margin-top: 1px; }
    .fact b { display: block; font-weight: 600; }
    .fact span { color: var(--dim); font-size: 14px; }
    .desc { color: var(--dim); white-space: pre-wrap; margin: 0 0 22px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
    .card h2 { font-family: "Oswald", sans-serif; font-size: 22px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
    .card .sub { color: var(--dim); font-size: 14px; margin-bottom: 16px; }
    label.f { display: block; font-size: 13px; font-weight: 600; color: var(--dim); margin-bottom: 14px; }
    label.f input { display: block; width: 100%; margin-top: 6px; height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #3a3a40; background: #0f0f12; color: var(--ink); font: inherit; font-size: 17px; }
    label.f input:focus { outline: none; border-color: var(--red); }
    .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--dim); margin: 4px 0 18px; cursor: pointer; }
    .consent input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--red); flex: none; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 56px; border: 0; border-radius: 12px; background: var(--red); color: #fff; font-family: "Oswald", sans-serif; font-size: 19px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; text-decoration: none; }
    .btn:hover { background: var(--red2); }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn.ghost { background: transparent; border: 1px solid #3a3a40; color: var(--ink); font-size: 16px; height: 50px; }
    .err { color: #ff8a80; font-size: 14px; min-height: 20px; margin-top: 10px; text-align: center; }
    .trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .left { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: rgba(224,43,43,.14); color: #ff8a80; margin-left: 8px; vertical-align: middle; letter-spacing: 0; text-transform: none; font-family: "Inter", sans-serif; }
    .done { text-align: center; padding: 30px 22px; }
    .done .ok { width: 72px; height: 72px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; margin: 0 auto 16px; }
    .done .ok svg { width: 36px; height: 36px; color: #fff; }
    .done h2 { font-size: 28px; }
    .done p { color: var(--dim); margin: 6px 0 20px; }
    .done .row { display: grid; gap: 10px; }
    .state { text-align: center; padding: 30px 22px; }
    .state b { display: block; font-family: "Oswald", sans-serif; font-size: 22px; text-transform: uppercase; margin-bottom: 6px; }
    .state p { color: var(--dim); margin-bottom: 18px; }
    .list { display: grid; gap: 12px; }
    .ev { display: grid; grid-template-columns: 70px 1fr; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; text-decoration: none; }
    .ev:hover { border-color: #3a3a40; }
    .dt { text-align: center; border-right: 1px solid var(--line); padding-right: 14px; }
    .dt b { display: block; font-family: "Oswald", sans-serif; font-size: 32px; font-weight: 600; line-height: 1; }
    .dt span { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--red); margin-top: 4px; }
    .ev .t { font-family: "Oswald", sans-serif; font-size: 20px; font-weight: 500; line-height: 1.2; }
    .ev .m { font-size: 13px; color: var(--dim); margin-top: 4px; }
    .ev .go { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--red); }
    .skel { height: 120px; border-radius: 16px; background: linear-gradient(90deg, #141417, #1c1c20, #141417); background-size: 200% 100%; animation: sh 1.2s infinite; }
    @keyframes sh { to { background-position: -200% 0; } }
    footer { text-align: center; font-size: 12px; color: var(--mute); padding: 20px; }
    footer a { color: var(--mute); }
    @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
  </style>
</head>
<body>
<div class="page">
  <header>
    <a class="brand" href="./"><img src="assets/img/monogram.png" alt="" width="34" height="37"><span>Не спать Москва</span></a>
    <a class="all" href="zapis.html" id="allLink" hidden>Все мероприятия</a>
  </header>
  <main id="main"><div class="skel"></div></main>
  <footer><a href="./">nespatmoskva.ru</a> · спортивное комьюнити Москвы</footer>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cal" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></symbol>
  <symbol id="i-time" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 7v5l3 2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
</svg>

<script>
/* Запись на мероприятие: ?e=<код> — одно мероприятие с формой, без кода — список ближайших.
   Сервер — crm/pub.php (защита от ботов описана там). На GitHub Pages PHP нет — там
   страница покажет, что запись доступна на nespatmoskva.ru. */
(function () {
  "use strict";
  var API = "crm/pub.php";
  var MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var MONS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
  var WD = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
  var main = document.getElementById("main");
  var code = (location.search.match(/[?&]e=([a-z0-9]{4,16})/i) || [])[1] || "";
  var token = "", tokenAt = 0;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function day(iso) { var m = iso.split("-"); return new Date(+m[0], +m[1] - 1, +m[2]); }
  function dlong(iso) { var d = day(iso); return d.getDate() + " " + MON[d.getMonth()] + ", " + WD[d.getDay()]; }
  function times(e) { return e.time_start + (e.time_end ? " – " + e.time_end : ""); }
  function icon(id) { return '<svg aria-hidden="true"><use href="#' + id + '"/></svg>'; }
  function get(a, q) {
    return fetch(API + "?a=" + a + (q || ""), { credentials: "same-origin" }).then(function (r) {
      return r.json().catch(function () { throw new Error("offline"); });
    });
  }
  function offline() {
    main.innerHTML = '<div class="card state"><b>Запись временно недоступна</b><p>Попробуйте чуть позже или напишите нам в Telegram — запишем вручную.</p><a class="btn ghost" href="./">На главную</a></div>';
  }
  function getToken() {
    if (token && Date.now() - tokenAt < 5 * 3600 * 1000) return Promise.resolve(token);
    return get("token").then(function (d) { token = d.token || ""; tokenAt = Date.now(); return token; });
  }

  function facts(e) {
    return '<div class="facts">' +
      '<div class="fact">' + icon("i-cal") + "<div><b>" + esc(dlong(e.date)) + "</b></div></div>" +
      '<div class="fact">' + icon("i-time") + "<div><b>" + esc(times(e)) + "</b></div></div>" +
      '<div class="fact">' + icon("i-pin") + "<div><b>" + esc(e.place) + "</b>" + (e.address ? "<span>" + esc(e.address) + "</span>" : "") +
      (e.map_url ? '<span> · <a href="' + esc(e.map_url) + '" target="_blank" rel="noopener">открыть на карте</a></span>' : "") + "</div></div></div>";
  }

  function showEvent(e) {
    document.title = e.title + " — запись · НЕ СПАТЬ МОСКВА";
    document.getElementById("allLink").hidden = false;
    var left = e.left != null && e.state === "open" ? '<span class="left">' + (e.left <= 5 ? "осталось мест: " + e.left : "мест: " + e.left) + "</span>" : "";
    var html = '<span class="eyebrow">' + esc(e.kind) + "</span><h1>" + esc(e.title) + "</h1>" + facts(e) +
      (e.description ? '<p class="desc">' + esc(e.description) + "</p>" : "");
    var msg = { past: ["Мероприятие уже прошло", "Посмотрите ближайшие — и до встречи на тренировке."],
      closed: ["Запись закрыта", "Набор на это мероприятие завершён. Посмотрите другие события клуба."],
      full: ["Мест больше нет", "Все места заняты. Посмотрите другие мероприятия клуба."],
      cancelled: ["Мероприятие отменено", "Следите за анонсами в канале клуба."] }[e.state];
    if (msg) {
      html += '<div class="card state"><b>' + msg[0] + "</b><p>" + msg[1] + '</p><a class="btn ghost" href="zapis.html">Ближайшие мероприятия</a></div>';
      main.innerHTML = html;
      return;
    }
    html += '<form class="card" id="f" novalidate autocomplete="on"><h2>Записаться' + left + '</h2><p class="sub">Имя и телефон — больше ничего не нужно.</p>' +
      '<label class="f">Как тебя зовут<input type="text" name="name" id="name" autocomplete="name" maxlength="80" required placeholder="Имя и фамилия"></label>' +
      '<label class="f">Телефон<input type="tel" name="phone" id="phone" autocomplete="tel" inputmode="tel" required placeholder="+7 (___) ___-__-__"></label>' +
      '<label class="trap" aria-hidden="true">Компания<input type="text" name="company" id="company" tabindex="-1" autocomplete="off"></label>' +
      '<label class="consent"><input type="checkbox" id="consent"><span>Согласен(на) на обработку персональных данных — только чтобы клуб записал меня и связался по этому мероприятию.</span></label>' +
      '<button class="btn" id="go">Записаться</button><div class="err" id="err" role="alert"></div></form>';
    main.innerHTML = html;
    var f = document.getElementById("f"), phone = document.getElementById("phone"), err = document.getElementById("err"), go = document.getElementById("go");
    f.addEventListener("focusin", function () { getToken().catch(function () {}); }, { once: true });
    phone.addEventListener("input", function () {
      var d = phone.value.replace(/\D/g, "");
      if (!d) { phone.value = ""; return; }
      if (d[0] === "8") d = "7" + d.slice(1);
      if (d[0] !== "7") d = "7" + d;
      d = d.slice(0, 11);
      var o = "+7"; if (d.length > 1) o += " (" + d.slice(1, 4); if (d.length >= 4) o += ") " + d.slice(4, 7);
      if (d.length >= 7) o += "-" + d.slice(7, 9); if (d.length >= 9) o += "-" + d.slice(9, 11);
      phone.value = o;
    });
    f.onsubmit = function (ev) {
      ev.preventDefault();
      var name = document.getElementById("name").value.trim(), ph = phone.value.replace(/\D/g, "");
      if (!/\p{L}/u.test(name)) { err.textContent = "Напиши, как тебя зовут"; return; }
      if (ph.length !== 11) { err.textContent = "Проверь номер телефона"; return; }
      if (!document.getElementById("consent").checked) { err.textContent = "Отметь согласие на обработку данных"; return; }
      err.textContent = ""; go.disabled = true; go.textContent = "Записываем…";
      var body = { e: e.code, name: name, phone: ph, consent: true, company: document.getElementById("company").value };
      function send(retry) {
        return getToken().then(function (t) {
          body.token = t; token = "";
          return fetch(API + "?a=register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), credentials: "same-origin" });
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (d.ok) return done(d.event || e, name, d.already);
          if (!retry && /^token|too_fast/.test(d.why || "")) return new Promise(function (res) { setTimeout(res, 3200); }).then(function () { return send(true); });
          throw new Error(d.error || "Не получилось записаться");
        });
      }
      send(false).catch(function (x) {
        go.disabled = false; go.textContent = "Записаться";
        err.textContent = x.message === "offline" || x instanceof TypeError ? "Нет связи с сервером — попробуй ещё раз" : x.message;
      });
    };
  }

  function ics(e) {
    var d = e.date.replace(/-/g, ""), s = e.time_start.replace(":", "") + "00", en = (e.time_end || "").replace(":", "");
    var end = en ? en + "00" : String(Math.min(23, +e.time_start.slice(0, 2) + 2)).padStart(2, "0") + e.time_start.slice(3) + "00";
    var t = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//nespatmoskva//zapis//RU", "BEGIN:VEVENT",
      "UID:" + e.code + "@nespatmoskva.ru", "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z",
      "DTSTART;TZID=Europe/Moscow:" + d + "T" + s, "DTEND;TZID=Europe/Moscow:" + d + "T" + end,
      "SUMMARY:" + e.title.replace(/[,;]/g, " ") + " — НЕ СПАТЬ МОСКВА",
      "LOCATION:" + (e.place + (e.address ? ", " + e.address : "")).replace(/[,;]/g, " "),
      "URL:" + location.href.split("#")[0], "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    return "data:text/calendar;charset=utf-8," + encodeURIComponent(t);
  }

  function done(e, name, already) {
    main.innerHTML = '<div class="card done"><div class="ok">' + icon("i-ok") + "</div>" +
      "<h2>" + (already ? "Ты уже записан" : "Ты в списке!") + "</h2><p>" + esc(name.split(" ")[0]) + ", ждём тебя: " + esc(dlong(e.date)) + ", " + esc(times(e)) + ".<br>" + esc(e.place) + "</p>" +
      '<div class="row"><a class="btn" href="' + ics(e) + '" download="nespat-' + esc(e.code) + '.ics">Добавить в календарь</a>' +
      (e.map_url ? '<a class="btn ghost" href="' + esc(e.map_url) + '" target="_blank" rel="noopener">Как добраться</a>' : "") +
      '<a class="btn ghost" href="zapis.html">Другие мероприятия</a></div></div>';
    window.scrollTo(0, 0);
  }

  function showList(list) {
    document.title = "Ближайшие мероприятия — НЕ СПАТЬ МОСКВА";
    if (!list.length) {
      main.innerHTML = '<span class="eyebrow">Запись</span><h1>Ближайшие мероприятия</h1><div class="card state"><b>Скоро анонс</b><p>Новые тренировки и события появятся здесь и в канале клуба.</p><a class="btn ghost" href="./">На главную</a></div>';
      return;
    }
    main.innerHTML = '<span class="eyebrow">Запись</span><h1>Ближайшие мероприятия</h1><div class="list">' + list.map(function (e) {
      var d = day(e.date);
      return '<a class="ev" href="zapis.html?e=' + esc(e.code) + '"><div class="dt"><b>' + d.getDate() + "</b><span>" + MONS[d.getMonth()] + "</span></div>" +
        '<div><div class="t">' + esc(e.title) + '</div><div class="m">' + esc(WD[d.getDay()]) + ", " + esc(times(e)) + " · " + esc(e.place) + "</div>" +
        '<span class="go">' + (e.state === "full" ? "Мест нет" : "Записаться →") + "</span></div></a>";
    }).join("") + "</div>";
  }

  (code ? get("event", "&e=" + encodeURIComponent(code)).then(function (d) {
    if (d.ok) showEvent(d.event);
    else main.innerHTML = '<div class="card state"><b>Мероприятие не найдено</b><p>Возможно, ссылка устарела. Посмотрите ближайшие события клуба.</p><a class="btn ghost" href="zapis.html">Ближайшие мероприятия</a></div>';
  }) : get("events").then(function (d) { if (!d.ok) throw new Error(); showList(d.events); })).catch(offline);
})();
</script>
</body>
</html>
