name: Deploy to Beget

# Сайт выкладывается автоматически при каждом пуше в основную ветку.
# Нужны секреты репозитория: FTP_SERVER / FTP_USERNAME / FTP_PASSWORD / FTP_DIR.
# Пока секретов нет — шаг выкладки пропускается с предупреждением, не ошибкой.
on:
  push:
    branches: [claude/install-ui-ux-pro-max-skill-8bfxro, main]
  workflow_dispatch:

concurrency:
  group: deploy-beget
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, что секреты FTP заданы
        id: gate
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::секрет FTP_SERVER не задан — выкладка на Beget пропущена"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Забрать код
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Проверить, что ключевые файлы на месте
        if: steps.gate.outputs.ready == 'true'
        run: |
          for f in index.html 404.html .htaccess robots.txt sitemap.xml \
                   assets/css/style.css assets/js/main.js assets/js/config.js \
                   assets/img/team-main.jpg assets/img/monogram.png \
                   zapis.html crm/index.html crm/app.js crm/app.css crm/api.php crm/pub.php \
                   crm/lib/db.php crm/lib/auth.php crm/lib/.htaccess; do
            [ -f "$f" ] || { echo "::error::нет файла $f — выкладка остановлена"; exit 1; }
          done
          echo "все ключевые файлы на месте"

      - name: Залить на хостинг по FTP
        if: steps.gate.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftp
          # служебные файлы на хостинг не нужны
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            CLAUDE.md
            **/.DS_Store

      # Штаб (CRM) живой: PHP отвечает, база лежит над public_html, а не в папке сайта
      - name: Проверить штаб на живом сайте
        if: steps.gate.outputs.ready == 'true'
        run: |
          sleep 10
          r=$(curl -s --max-time 20 https://nespatmoskva.ru/crm/api.php?a=ping || true)
          echo "ping: $r"
          echo "$r" | grep -q '"ok":true' || { echo "::error::CRM не отвечает — проверь версию PHP сайта в панели Beget (нужна 8.x)"; exit 1; }
          echo "$r" | grep -q '"store":"outside"' || echo "::warning::база CRM лежит в запасной папке crm/data/"
          code=$(curl -s -o /dev/null -w '%{http_code}' https://nespatmoskva.ru/crm/lib/db.php)
          [ "$code" = "403" ] || { echo "::error::crm/lib/ открыт снаружи (код $code)"; exit 1; }
