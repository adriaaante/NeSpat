<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — НЕ СПАТЬ МОСКВА</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #0a0a0b;
      color: #f5f4f2;
      font-family: "Inter", system-ui, sans-serif;
      text-align: center;
    }
    .code {
      font-family: "Oswald", "Arial Narrow", sans-serif;
      font-size: clamp(84px, 22vw, 200px);
      font-weight: 700;
      line-height: .9;
      letter-spacing: -.02em;
      color: #e02b2b;
    }
    h1 {
      font-family: "Oswald", "Arial Narrow", sans-serif;
      font-size: clamp(24px, 5vw, 38px);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .02em;
      margin: 18px 0 12px;
    }
    p { color: #b6b3ae; line-height: 1.6; max-width: 34em; margin: 0 auto 32px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 34px;
      background: #e02b2b;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 14px;
      transition: background .25s;
    }
    .btn:hover { background: #ff3b3b; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, адрес изменился. Но тренировка никуда не делась — возвращайся на главную.</p>
    <a class="btn" href="/">На главную</a>
  </main>
</body>
</html>
